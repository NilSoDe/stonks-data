name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "templates/**", "tests/**", "requirements*.txt"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (sin red)
        run: python -m pytest -q
