name: Señales Stonks Europa

on:
  schedule:
    # Lunes a viernes antes del mail de las 08:47 (Madrid). GitHub suele arrancar
    # con hasta 1 h de retraso: tres intentos desde las 03:41 UTC.
    # Si un intento ya dejó las señales completas, los siguientes terminan en segundos.
    - cron: "41 3 * * 1-5"
    - cron: "13 4 * * 1-5"
    - cron: "47 4 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del mail histórico AAAA-MM-DD (vacío = hoy)"
        required: false
        default: ""
      debug:
        description: "1 = imprimir en el registro las notificaciones que no se han podido leer"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Las pruebas con fecha (o en otra rama) no hacen cola con la ejecución diaria.
  group: fetch-eu-${{ github.ref_name }}-${{ github.event.inputs.fecha }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      STONKS_CACHE: .cache/http
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Caché de documentos que no cambian (Form 4, PDF, anuncios)
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-eu-${{ github.run_id }}
          restore-keys: http-eu-
      - name: Generar señales de Europa
        env:
          HIST_DATE: ${{ github.event.inputs.fecha }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          EU_DEBUG: ${{ github.event.inputs.debug }}
        run: python scripts/signals_eu.py
      - name: Publicar el informe web (GitHub Pages)
        id: web
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            bash scripts/publish_site.sh eu "data/eu/historico/signals-${{ github.event.inputs.fecha }}.json"
          else
            bash scripts/publish_site.sh eu
          fi
      - name: Generar el mail
        env:
          # Solo trae valor si la página ya responde: sin él, el mail sale sin botón (nunca un enlace roto).
          REPORT_URL: ${{ steps.web.outputs.url }}
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            python scripts/render_mail.py eu "data/eu/historico/signals-${{ github.event.inputs.fecha }}.json"
          else
            python scripts/render_mail.py eu
          fi
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Señales Europa $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
