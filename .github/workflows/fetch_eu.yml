name: Señales Stonks Europa

on:
  schedule:
    # Lunes a viernes antes del mail de las 08:47 (Madrid). GitHub suele arrancar
    # con hasta 1 h de retraso: tres intentos desde las 03:41 UTC.
    # Si un intento ya dejó las señales completas, los siguientes terminan en segundos.
    - cron: "41 3 * * 1-5"
    - cron: "13 4 * * 1-5"
    - cron: "47 4 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del mail histórico AAAA-MM-DD (vacío = hoy)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-eu
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar señales de Europa
        env:
          HIST_DATE: ${{ github.event.inputs.fecha }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/signals_eu.py
      - name: Generar el mail
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            python scripts/render_mail.py eu "data/eu/historico/signals-${{ github.event.inputs.fecha }}.json"
          else
            python scripts/render_mail.py eu
          fi
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Señales Europa $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
