name: Descargar OpenInsider

on:
  schedule:
    # Lunes a viernes. GitHub usa UTC y suele retrasarse 10-30 min.
    # 19:40 UTC cubre el horario de verano y 20:35 UTC el de invierno,
    # ambos antes del mail de las 22:13 (Madrid).
    - cron: "40 19 * * 1-5"
    - cron: "35 20 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha histórica AAAA-MM-DD (vacío = descarga normal)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Descargar tablas
        env:
          HIST_DATE: ${{ github.event.inputs.fecha }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/fetch_openinsider.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos OpenInsider $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
