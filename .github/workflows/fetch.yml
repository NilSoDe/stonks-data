name: Señales Stonks

on:
  schedule:
    # Lunes a viernes por la mañana, antes del mail de las 08:17 (Madrid).
    # GitHub usa UTC y suele retrasarse 10-30 min. 05:07 UTC cubre el horario
    # de verano (mail a las 06:17 UTC) y 05:41 UTC es un segundo intento.
    - cron: "7 5 * * 1-5"
    - cron: "41 5 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha del mail histórico AAAA-MM-DD (vacío = hoy)"
        required: false
        default: ""
      force_sec:
        description: "1 = probar el respaldo de la SEC sin OpenInsider"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Generar señales
        env:
          HIST_DATE: ${{ github.event.inputs.fecha }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          FORCE_SEC: ${{ github.event.inputs.force_sec }}
        run: python scripts/signals.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Señales $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main
          git push
