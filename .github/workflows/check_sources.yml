name: Comprobar fuentes

on:
  workflow_dispatch:
  push:
    branches: [pruebas-reales]
    paths: [".github/workflows/check_sources.yml", "scripts/check_sources.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar cada fuente real
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/check_sources.py | tee -a "$GITHUB_STEP_SUMMARY"
